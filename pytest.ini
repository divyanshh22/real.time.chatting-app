[pytest]
DJANGO_SETTINGS_MODULE = settings_test
python_files = tests.py test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra -q --strict-markers --cov=. --cov-report=term-missing --cov-report=xml
markers =
    unit: fast, isolated unit tests (models, forms logic, helpers)
    integration: tests that exercise views/URLs/DB through the Django test client
    websocket: tests that exercise Django Channels consumers over WebSocket
    security: security-focused tests (auth, CSRF, XSS, settings sanity)
